<style>
  :root {
    --ink: #1c212b;
    --bg: #f4f4f4;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: clamp(16px, 3vw, 32px);
    padding: 24px;
  }
  .brand__mark {
    width: clamp(56px, 9vw, 96px);
    height: auto;
    flex-shrink: 0;
  }
  .brand__mark rect {
    fill: var(--ink);
  }
  .brand__name {
    font-weight: 800;
    font-size: clamp(32px, 7vw, 72px);
    color: var(--ink);
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="brand">
    <svg class="brand__mark" viewBox="-70 -75 140 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="-29" y="-65" width="26" height="26" rx="9"/>
      <rect x="3"   y="-65" width="26" height="26" rx="9"/>
      <rect x="-45" y="-39" width="26" height="26" rx="9"/>
      <rect x="-13" y="-39" width="26" height="26" rx="9"/>
      <rect x="19"  y="-39" width="26" height="26" rx="9"/>

      <rect x="-29" y="-13" width="26" height="26" rx="9"/>

      <rect x="35"  y="-13" width="26" height="26" rx="9"/>
      <rect x="-45" y="13"  width="26" height="26" rx="9"/>
      <rect x="-13" y="13"  width="26" height="26" rx="9"/>
      <rect x="19"  y="13"  width="26" height="26" rx="9"/>
      <rect x="-29" y="39"  width="26" height="26" rx="9"/>
      <rect x="3"   y="39"  width="26" height="26" rx="9"/>

    <span class="brand__name">Океан Тех</span>
  </div>
